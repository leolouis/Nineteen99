name: Build Nineteen99 Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Codebase
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🚀 Setup Flutter Framework Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Fetch Application Dependencies
        run: |
          cd Nineteen99-main/frontend_flutter
          flutter pub get

      - name: 🏗️ Compile Production Release APK (With Asset Fallbacks)
        run: |
          cd Nineteen99-main/frontend_flutter
          flutter build apk --release --no-tree-shake-icons --no-pub

      - name: 💾 Export APK Artifact to GitHub Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: Nineteen99-Android-Application
          path: Nineteen99-main/frontend_flutter/build/app/outputs/flutter-apk/app-release.apk
          
